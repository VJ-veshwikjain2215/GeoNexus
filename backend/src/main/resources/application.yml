# GeoNexus backend configuration.
# All environment-specific values come from environment variables (see ../.env.example).
# There are intentionally NO default credentials: DB_USERNAME and DB_PASSWORD must be supplied,
# otherwise the application refuses to start.

spring:
  application:
    name: geonexus-backend
  config:
    # Optional local convenience: loads KEY=VALUE pairs from the shared ../.env file (relative to backend/).
    # Real environment variables take precedence over this file. Do not quote values in .env.
    import: "optional:file:../.env[.properties]"
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:geonexus}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      # Schema changes are made only by versioned Flyway migrations, never by Hibernate.
      # Do not use create/update, and avoid validate (spatial column type validation is unreliable).
      ddl-auto: none
  flyway:
    enabled: true
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    # Never leak exception messages, stack traces, or binding details to clients.
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
    include-exception: false

geonexus:
  security:
    jwt:
      # REQUIRED, no default: Base64 of >= 32 random bytes (openssl rand -base64 48). The app refuses to start without it.
      secret: ${GEONEXUS_SECURITY_JWT_SECRET}
      issuer: ${GEONEXUS_SECURITY_JWT_ISSUER:geonexus}
      audience: ${GEONEXUS_SECURITY_JWT_AUDIENCE:geonexus-api}
      access-token-ttl: ${GEONEXUS_SECURITY_JWT_ACCESS_TOKEN_TTL:PT30M}
    cors:
      # Comma-separated list of exact origins. Wildcards are rejected at startup.
      allowed-origins: ${GEONEXUS_CORS_ALLOWED_ORIGINS:http://localhost:5173}
      max-age-seconds: ${GEONEXUS_SECURITY_CORS_MAX_AGE_SECONDS:3600}
    login:
      max-failed-attempts: ${GEONEXUS_SECURITY_LOGIN_MAX_FAILED_ATTEMPTS:5}
      lockout-window: ${GEONEXUS_SECURITY_LOGIN_LOCKOUT_WINDOW:PT15M}
