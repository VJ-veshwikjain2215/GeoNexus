# GeoNexus development database and full-stack deployment configuration.
# Compose reads values from the `.env` file next to this file (copy `.env.example` first).
# Run `docker compose up -d db` to start the PostGIS database service alone (default local dev).
# Run `docker compose --profile full-stack up -d` to launch the complete database, backend and frontend stack.
name: geonexus

services:
  db:
    image: postgis/postgis:16-3.5
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-geonexus}
      POSTGRES_USER: ${DB_USERNAME:?Set DB_USERNAME in .env (see .env.example)}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env (see .env.example)}
    ports:
      # Bound to the loopback interface only: the database is not exposed to the network.
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - geonexus_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-geonexus}
      DB_USERNAME: ${DB_USERNAME:?Set DB_USERNAME in .env}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      SERVER_PORT: ${SERVER_PORT:-8080}
      GEONEXUS_SECURITY_JWT_SECRET: ${GEONEXUS_SECURITY_JWT_SECRET:?Set GEONEXUS_SECURITY_JWT_SECRET in .env}
      GEONEXUS_CORS_ALLOWED_ORIGINS: ${GEONEXUS_CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:80,http://localhost}
    ports:
      - "127.0.0.1:${SERVER_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
    profiles:
      - full-stack
      - app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:80:80"
    profiles:
      - full-stack
      - app

volumes:
  geonexus_pgdata:
