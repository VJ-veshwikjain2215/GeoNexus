name: CI

on:
  push:
    branches: [main, j_veshwik]
  pull_request:
    branches: [main, j_veshwik]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (Lint, Typecheck, Test, Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Install dependencies
        run: npm ci

      - name: Lint source code
        run: npm run lint

      - name: Typecheck TypeScript
        run: npm run typecheck

      - name: Run unit & component tests
        run: npm test

      - name: Build production bundle
        run: npm run build

  backend:
    name: Backend (Maven Test & Build)
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_DB: geonexus
          POSTGRES_USER: geonexus_app
          POSTGRES_PASSWORD: test_password_123!
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Compile and run test suite
        run: mvn test -B
        env:
          GEONEXUS_TEST_DB_URL: jdbc:postgresql://localhost:5432/geonexus
          GEONEXUS_TEST_DB_USER: geonexus_app
          GEONEXUS_TEST_DB_PASSWORD: test_password_123!
          GEONEXUS_SECURITY_JWT_SECRET: c2VjdXJlX2p3dF9zZWNyZXRfa2V5X2Zvcl9jaV90ZXN0aW5nXzMyYnl0ZXM=

      - name: Package application JAR
        run: mvn package -DskipTests -B
