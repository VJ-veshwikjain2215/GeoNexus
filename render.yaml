services:
  - type: web
    name: geonexus-backend
    runtime: docker
    plan: free
    region: singapore
    rootDir: ./backend
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /api/v1/health
    autoDeploy: false
    envVars:
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_FLYWAY_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: GEONEXUS_SECURITY_JWT_SECRET
        generateValue: true
      - key: GEONEXUS_CORS_ALLOWED_ORIGINS
        sync: false
      - key: GEONEXUS_SECURITY_BOOTSTRAP_ADMIN_ENABLED
        value: "true"
      - key: GEONEXUS_SECURITY_BOOTSTRAP_ADMIN_USERNAME
        value: "admin"
      - key: GEONEXUS_SECURITY_BOOTSTRAP_ADMIN_PASSWORD
        sync: false
